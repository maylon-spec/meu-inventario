
name: meu_inventario
description: Aplicativo de inventário residencial com leitor Bluetooth, banco local e sincronização na nuvem.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  audioplayers: ^6.1.0
  firebase_core: ^3.8.1
  cloud_firestore: ^5.5.1
  connectivity_plus: ^6.1.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/audio/scan_beep.wav
